# Title regex -> specific role + family. Matched against the lower-cased posting title.
# Rules are ordered specific -> general; the FIRST match wins. Reviewed like code
# (see tests/test_labels.py). Use \b word boundaries: "unity" must not match "opportunity".
families:
  - Software Development
  - QA & Testing
  - Data & Analytics
  - IT Infra & Support
  - ERP / Enterprise Apps
  - Sales & BD
  - Customer Service / BPO
  - HR & Recruitment
  - Accounting & Finance
  - Banking & Financial Services
  - Marketing
  - Content & Media
  - Teaching & Training
  - Design & Creative
  - Healthcare & Pharma
  - Manufacturing & Core Engg
  - Construction & Site Engg
  - Supply Chain & Logistics
  - Office Admin & Data Entry
  - Hospitality
  - Legal
  - Strategy & Consulting

# Families that Naukri lumps together under one 'IT' functional area (agreement is also reported grouped).
it_group: [Software Development, QA & Testing, Data & Analytics, IT Infra & Support, ERP / Enterprise Apps]

# Naukri 2019 "Functional Area" keyword -> our family (used only to score label agreement).
naukri_functional_area:
