# Many-to-many view of Naukri 2019 "Functional Area": families a posting under that area could sensibly belong to.
# Matched by lower-case substring, first match wins (specific first). Used for the "plausible" agreement metric.
naukri_plausible:
  "it hardware": [IT Infra & Support, Customer Service / BPO]
  "it software": [Software Development, QA & Testing, Data & Analytics, IT Infra & Support, ERP / Enterprise Apps, Strategy & Consulting, Design & Creative]
  "ites": [Customer Service / BPO, Sales & BD, IT Infra & Support, Office Admin & Data Entry, Accounting & Finance, Banking & Financial Services, HR & Recruitment]
  "engineering design": [Manufacturing & Core Engg, Construction & Site Engg, Design & Creative, Software Development]
  "architecture": [Construction & Site Engg, Design & Creative]
  "fashion": [Design & Creative, Manufacturing & Core Engg, Supply Chain & Logistics]
  "sales , retail": [Sales & BD, Marketing, Banking & Financial Services, Customer Service / BPO]
  "hr ,": [HR & Recruitment, Office Admin & Data Entry]
  "accounts": [Accounting & Finance, Legal, Banking & Financial Services]
  "financial services": [Banking & Financial Services, Accounting & Finance, Sales & BD]
  "marketing": [Marketing, Content & Media, Design & Creative, Sales & BD]
  "production": [Manufacturing & Core Engg, Supply Chain & Logistics, Construction & Site Engg]
