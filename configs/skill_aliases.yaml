# canonical skill: [variants that mean the same thing]
#
# Before this map is applied, every tag is lower-cased, whitespace is collapsed and
# spaces around / + - # . are removed ("c + +" → "c++", "ci / cd" → "ci/cd",
# "pl / sql" → "pl/sql"), so those spellings don't need entries here.
# Variants were found by grouping the 4,000 most common tags across the 2019, 2022
# and 2025 Naukri snapshots (see notebooks/01_eda.ipynb, section 2).
#
# Judgement calls, open to change:
#   - angularjs (1.x) is merged into angular: job postings use them interchangeably.
#   - advanced excel / ms excel are merged into excel: the search box should offer one "excel".
#   - tally erp / tally prime are merged into tally.

