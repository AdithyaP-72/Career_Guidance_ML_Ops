# Every tunable value in the pipeline. DVC tracks these: change one, and `dvc repro`
# reruns only the stages that use it. Try variants without editing this file:
#   uv run dvc exp run -S taxonomy.min_train_postings=200

data:
  min_skills: 3            # postings listing fewer skills are not used for training or profiles

taxonomy:                  # which candidate roles become classes (src/data/taxonomy.py)
  train_snapshot: 2025
  reference_snapshot: 2019
  min_train_postings: 100  # role needs at least this many usable 2025 postings to be a class
  min_reference_postings: 20  # below this in 2019 → "emerging" (no 2019 baseline for drift)

split:
  test_size: 0.2
  seed: 42

features:
  top_k_skills: 6000       # vocabulary size = the skills the search box offers (6,000 beat 1,500 by ~5 pts top-3)
  exp_clip: 20             # years of experience above this are treated as 20
  eval_n_skills: 5         # test inputs are cut to this many skills (what users really enter)
  dropout:                 # training-time augmentation: extra copies of each posting cut to min_k..max_k skills
    copies: 2
    min_k: 2
    max_k: 6
    seed: 42

profiles:
  core_min_share: 0.08     # a skill is "core" for a role if ≥ 8% of its postings ask for it
  max_core_skills: 12
  top_n_skills: 30
  top_n_titles: 5

profiling:
  minimal: true            # fg-data-profiling minimal mode: fast, skips correlations
  snapshots: [2017, 2019, 2022, 2025]

train:                     # Step 5 baselines (src/models/train.py; one dvc stage per model)
  models: [dummy, profile, logreg, random_forest, lightgbm, mlp, sgd, complement_nb]
  skill_dropout: true      # train on postings + their cut-down copies (features.dropout)
  experiment: career-role-baselines   # MLflow experiment name
  # Each block below is passed straight to the model's constructor.
  # No class weighting: "balanced" weights cost ~6 pts of top-3 accuracy (they favour rare roles).
  dummy:
    strategy: prior        # predict class frequencies -> top-3 = the three biggest roles
  profile:
    temperature: 0.05      # only shapes the confidence %, not the ranking
  logreg:
    C: 0.5
    max_iter: 2000
  random_forest:
    n_estimators: 100
    min_samples_leaf: 5    # bigger leaves keep the saved model small (200 trees / leaf 2 was 761 MB)
    max_features: sqrt
    n_jobs: -1
    random_state: 42
  lightgbm:                # 103 classes = 103 trees per round, so few, small, regularised rounds;
    n_estimators: 120      # library defaults diverge on this many classes
    learning_rate: 0.08
    num_leaves: 15
    min_child_samples: 10
    colsample_bytree: 0.2
    reg_lambda: 1.0
    force_col_wise: true
    n_jobs: -1
    random_state: 42
    verbose: -1
  mlp:                     # Phase 4b challenger: learns dense skill embeddings & non-linear synergy
    hidden_layer_sizes: [256, 128]
    activation: relu
    solver: adam
    alpha: 0.0001          # L2 regularisation
    early_stopping: true
    validation_fraction: 0.1
    max_iter: 200
    random_state: 42
  sgd:                     # Phase 4b challenger: strong linear margin in high-dimensional space
    loss: modified_huber   # calibrated probabilities, robust to outliers
    alpha: 0.0001
    max_iter: 1000
    tol: 0.001
    random_state: 42
    n_jobs: -1
  complement_nb:           # Phase 4b challenger: purpose-built for imbalanced sparse counts
    alpha: 1.0             # Laplace smoothing
    norm: false

select:                    # src/models/select.py
  metric: top3_5skills     # best baseline = highest top-3 accuracy on 5-skill test inputs
