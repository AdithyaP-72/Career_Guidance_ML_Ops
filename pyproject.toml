[project]
name = "career-guidance"
version = "0.2.0"
requires-python = ">=3.12"
# Base = what it takes to LOAD and RUN a trained model. Shared by the pipeline and the API image.
dependencies = [
    "lightgbm>=4.7.0",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
]

[dependency-groups]
# Data + training pipeline: dvc repro, profiling, MLflow tracking and the model registry.
pipeline = [
    "dvc[s3]>=3.67.1",
    "fg-data-profiling>=4.20.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.1",
    "openpyxl>=3.1.5",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
]
# Inference API. The Docker image installs ONLY the base dependencies + this group.
serve = [
    "fastapi>=0.115.0",
    "pypdf>=7.0.0",          # resume upload: PDF text
    "python-docx>=1.2.0",    # resume upload: Word text
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.14.6",     # resume upload: typo-tolerant skill matching
    "uvicorn>=0.32.0",
]
dev = [
    "httpx>=0.28.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "python-pptx>=1.0.2",
    "ruff>=0.16.10",
]

[tool.uv]
# `uv sync` keeps installing everything, exactly like before the split.
default-groups = ["pipeline", "serve", "dev"]
