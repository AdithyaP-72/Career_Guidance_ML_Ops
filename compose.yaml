name: career-phase3

services:
  api:
    build:
      context: .
      args:
        MODEL_BUNDLE: .phase3/bundle
        GIT_SHA: ${PHASE3_GIT_SHA:-local-phase3}
    environment:
      MONITORING_TOKEN_FILE: /run/phase3/monitoring_token
      PHASE3_EVIDENCE_DIR: /phase3-reports
      PHASE3_DEMO: 'true'
      MONITORING_WINDOW_SIZE: '1500'
      MONITORING_WINDOW_SECONDS: '900'
      RATE_PREDICT_PER_MIN: '3600'
      RATE_PREDICT_TOTAL_PER_MIN: '3600'
    volumes:
      - ./.phase3/secrets/monitoring_token:/run/phase3/monitoring_token:ro
      - ./reports/phase3:/phase3-reports:ro
    ports:
      - '127.0.0.1:${PHASE3_API_PORT:-8000}:8000'
    mem_limit: 1g
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./.phase3/secrets/monitoring_token:/run/phase3/monitoring_token:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${PHASE3_PROMETHEUS_PORT:-9090}:9090'
    healthcheck:
      test: [CMD, promtool, check, ready, '--url=http://localhost:9090']
      interval: 15s
      timeout: 4s
      retries: 6
    depends_on:
      - api
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.6
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/phase3/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/opt/phase3/dashboards:ro
      - ./.phase3/secrets/grafana_password:/run/phase3/grafana_password:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:${PHASE3_GRAFANA_PORT:-3000}:3000'
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 4s
      retries: 6
    depends_on:
      - prometheus
    mem_limit: 512m
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
